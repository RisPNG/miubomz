---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [bind]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [bind]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /var/log
    subvolume: /@var_log
  - mountPoint: /var/cache
    subvolume: /@var_cache
  - mountPoint: /var/tmp
    subvolume: /@var_tmp
btrfsSwapSubvol: /@swap
mountOptions:
  - filesystem: default
    options: [defaults]
  - filesystem: efi
    options: [defaults, umask=0077]
  - filesystem: btrfs
    options: [defaults, "compress=zstd"]
  - filesystem: btrfs_swap
    options: [defaults, noatime]
